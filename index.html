<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2a2a2a;
    --muted: #8a8378;
    --line: #ece6dc;
    --accent-a: #e07856;
    --accent-b: #6b8e9e;
    --gold: #d4a84b;
    --green: #7a9e5f;
    --soft-a: #fce8df;
    --soft-b: #dee9ed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .who-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .who-a { background: var(--soft-a); color: var(--accent-a); }
  .who-b { background: var(--soft-b); color: var(--accent-b); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .question {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 18px;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .option {
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    transition: all 0.15s;
  }

  .option:hover { border-color: var(--ink); }
  .option.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: white;
  }
  .option.disabled { opacity: 0.5; cursor: not-allowed; }

  .step-hint {
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 8px;
    text-align: center;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--ink);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 12px;
  }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
  }
  .btn-small {
    padding: 8px 14px;
    width: auto;
    font-size: 13px;
    margin-top: 0;
  }

  .nav {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .nav button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
  }
  .nav button.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .score-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .score-num {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .score-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 2px;
  }

  .reveal-banner {
    background: var(--soft-a);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    text-align: center;
    font-size: 14px;
    color: var(--accent-a);
    font-weight: 600;
  }
  .reveal-banner.match { background: #e6f0db; color: var(--green); }

  .reveal-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    align-items: center;
  }
  .reveal-row:last-child { border-bottom: none; }
  .reveal-who { font-weight: 600; font-size: 12px; }
  .reveal-mark { font-size: 14px; }
  .reveal-mark.correct { color: var(--green); }
  .reveal-mark.wrong { color: var(--muted); }

  .history-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .history-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .history-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .history-detail { font-size: 13px; line-height: 1.6; }
  .pill {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-left: 4px;
    font-weight: 600;
  }
  .pill-guess { background: #f3e8c7; color: #8a6d1e; }
  .pill-sync { background: #dceacb; color: #4d6b35; }

  .input, .textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--ink); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .who-pick {
    text-align: center;
    padding: 30px 0;
  }
  .who-pick h2 {
    font-size: 24px;
    margin-bottom: 6px;
  }
  .who-pick p {
    color: var(--muted);
    margin-bottom: 30px;
    font-size: 14px;
  }
  .who-options {
    display: grid;
    gap: 12px;
  }
  .who-option {
    padding: 20px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
  }
  .who-option.a { border-color: var(--accent-a); color: var(--accent-a); }
  .who-option.b { border-color: var(--accent-b); color: var(--accent-b); }

  .waiting {
    text-align: center;
    padding: 30px 20px;
  }
  .waiting-icon {
    font-size: 36px;
    margin-bottom: 12px;
  }
  .waiting-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .waiting-sub {
    font-size: 13px;
    color: var(--muted);
  }

  .name-edit {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-family: inherit;
    text-decoration: underline;
  }

  .swap-btn {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-family: inherit;
    text-decoration: underline;
    margin-top: 8px;
  }

  .info-tip {
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }

  const DAILY_LIMIT = 3;

  // ============ 狀態管理 ============
  // ============ 房間機制 ============
  let roomCode = null;
  let unsubscribe = null;  // Firestore 訂閱取消函式

  function loadRoom() {
    try {
      return localStorage.getItem('roomCode');
    } catch { return null; }
  }
  function saveRoom(code) {
    try { localStorage.setItem('roomCode', code); } catch {}
    roomCode = code;
  }
  function clearRoom() {
    try { localStorage.removeItem('roomCode'); } catch {}
    roomCode = null;
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  }
  let state = null;
  let myRole = null; // 'A' or 'B'
  let currentView = 'play'; // play | history | add | scores
  let savedNamesCache = null;

  // 從 localStorage 拿身分（跟房間綁定，不同房間身分獨立）
  function loadRole() {
    try {
      if (!roomCode) return null;
      return localStorage.getItem('role:' + roomCode);
    } catch { return null; }
  }
  function saveRole(r) {
    try {
      if (roomCode) localStorage.setItem('role:' + roomCode, r);
    } catch {}
    myRole = r;
  }
  function clearRole() {
    try {
      if (roomCode) localStorage.removeItem('role:' + roomCode);
    } catch {}
    myRole = null;
  }

  // ============ 雲端資料 ============
  // 結構：
  // {
  //   names: { A: "玩家A", B: "玩家B" },
  //   customQuestions: [{ q, a, b, addedBy }],
  //   usedIndices: [int],      // 已用過的題目 index（內建+自訂混合排序後）
  //   currentRound: {
  //     questionIdx: int,
  //     question: {q, a, b},
  //     A: { answer: 'a'|'b', guess: 'a'|'b' } | null,
  //     B: { answer: 'a'|'b', guess: 'a'|'b' } | null,
  //     revealed: boolean
  //   } | null,
  //   scores: { A: {guess: 0, sync: 0}, B: {guess: 0, sync: 0} },
  //   history: [ { question, A: {...}, B: {...}, date } ]
  // }

  async function loadState() {
    if (!roomCode) return defaultState();
    try {
      const snap = await getDoc(doc(db, 'rooms', roomCode));
      if (snap.exists()) {
        return snap.data();
      }
    } catch (e) {
      console.error('load failed', e);
    }
    return defaultState();
  }

  function defaultState() {
    return {
      names: { A: '玩家 A', B: '玩家 B' },
      customQuestions: [],
      usedIndices: [],
      currentRound: null,
      scores: { A: {guess: 0, sync: 0}, B: {guess: 0, sync: 0} },
      history: [],
      dailyProgress: { date: '', count: 0 },
      claimedRoles: { A: false, B: false }
    };
  }

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function ensureDailyProgress() {
    if (!state.dailyProgress) state.dailyProgress = { date: '', count: 0 };
    const today = todayKey();
    if (state.dailyProgress.date !== today) {
      state.dailyProgress = { date: today, count: 0 };
    }
  }

  function remainingToday() {
    ensureDailyProgress();
    return Math.max(0, DAILY_LIMIT - state.dailyProgress.count);
  }

  async function saveState() {
    if (!roomCode) return;
    try {
      await setDoc(doc(db, 'rooms', roomCode), state);
    } catch (e) {
      console.error('save failed', e);
    }
  }

  // ============ 題目池 ============
  function getAllQuestions() {
    return [
      ...BUILTIN_QUESTIONS.map(q => ({...q, source: 'builtin'})),
      ...state.customQuestions.map(q => ({...q, source: 'custom'}))
    ];
  }

  function pickNewQuestion() {
    const all = getAllQuestions();
    const available = all
      .map((q, i) => ({q, i}))
      .filter(x => !state.usedIndices.includes(x.i));

    if (available.length === 0) {
      // 全部答過了，重設
      state.usedIndices = [];
      return pickNewQuestion();
    }

    const pick = available[Math.floor(Math.random() * available.length)];
    return { index: pick.i, question: pick.q };
  }

  async function startNewRound() {
    const picked = pickNewQuestion();
    state.currentRound = {
      questionIdx: picked.index,
      question: {
        q: picked.question.q,
        a: picked.question.a,
        b: picked.question.b,
        cat: picked.question.cat || 'daily'
      },
      A: null,
      B: null,
      revealed: false
    };
    state.usedIndices.push(picked.index);
    await saveState();
    render();
  }

  async function submitAnswer(answer, guess) {
    if (!state.currentRound) return;
    state.currentRound[myRole] = { answer, guess };

    // 兩人都答完 → 由本機執行揭曉（如果對方早已寫好答案）
    if (state.currentRound.A && state.currentRound.B && !state.currentRound.revealed) {
      doReveal();
    }

    await saveState();
    render();
  }

  // 揭曉 + 計分（只在 currentRound.revealed 還是 false 時才執行）
  function doReveal() {
    if (!state.currentRound || state.currentRound.revealed) return;
    const A = state.currentRound.A;
    const B = state.currentRound.B;
    if (!A || !B) return;

    state.currentRound.revealed = true;

    if (A.guess === B.answer) state.scores.A.guess++;
    if (B.guess === A.answer) state.scores.B.guess++;
    if (A.answer === B.answer) {
      state.scores.A.sync++;
      state.scores.B.sync++;
    }

    state.history.unshift({
      question: state.currentRound.question,
      A: { ...A },
      B: { ...B },
      date: new Date().toISOString()
    });
    state.history = state.history.slice(0, 100);

    ensureDailyProgress();
    state.dailyProgress.count++;
  }

  // ============ 渲染 ============
  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'onclick') e.onclick = v;
      else if (k === 'oninput') e.oninput = v;
      else if (k === 'onchange') e.onchange = v;
      else if (k === 'html') e.innerHTML = v;
      else e.setAttribute(k, v);
    }
    if (typeof children === 'string') e.textContent = children;
    else children.forEach(c => c && e.appendChild(c));
    return e;
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    // 還沒選房間 → 顯示房間選擇畫面
    if (!roomCode) {
      app.appendChild(renderRoomPick());
      return;
    }

    // 如果還沒選身分
    if (!myRole) {
      app.appendChild(renderWhoPick());
      return;
    }

    app.appendChild(renderHeader());
    app.appendChild(renderNav());

    if (currentView === 'play') app.appendChild(renderPlay());
    else if (currentView === 'scores') app.appendChild(renderScores());
    else if (currentView === 'history') app.appendChild(renderHistory());
    else if (currentView === 'add') app.appendChild(renderAdd());
  }

  function renderRoomPick() {
    const wrap = el('div', { class: 'who-pick' });
    wrap.appendChild(el('h2', {}, '默契猜猜'));
    wrap.appendChild(el('p', {}, '輸入你們專屬的房間代碼'));

    const input = el('input', {
      class: 'input',
      placeholder: '輸入代碼...',
      style: 'font-size: 16px; padding: 14px; text-align: center; margin-top: 20px;'
    });
    wrap.appendChild(input);

    const enterBtn = el('button', {
      class: 'btn',
      style: 'margin-top: 12px;',
      onclick: async () => {
        const code = input.value.trim().toLowerCase()
          .replace(/[^a-z0-9_-]/g, '');  // 只留英數、底線、減號
        if (!code) {
          alert('請輸入房間代碼');
          return;
        }
        if (code.length < 3) {
          alert('代碼至少 3 個字');
          return;
        }
        enterBtn.disabled = true;
        enterBtn.textContent = '連線中...';
        try {
          await connectRoom(code);
        } catch (e) {
          console.error('connect failed', e);
          alert('連線失敗：' + (e.message || '未知錯誤') + '\n\n請檢查網路或稍後再試。');

  function renderWhoPick() {
    const wrap = el('div', { class: 'who-pick' });
    wrap.appendChild(el('h2', {}, '默契猜猜'));
    wrap.appendChild(el('p', {}, '你是哪一位？'));

    // 確保 claimedRoles 欄位存在（舊資料相容）
    if (!state.claimedRoles) state.claimedRoles = { A: false, B: false };

    const opts = el('div', { class: 'who-options' });

    ['A', 'B'].forEach(role => {
      const claimed = state.claimedRoles[role];
      const btn = el('button', {
        class: `who-option ${role.toLowerCase()}`,
        style: claimed ? 'opacity: 0.35; cursor: not-allowed;' : '',
        onclick: async () => {
          if (claimed) return;
          // 再次從雲端撈最新狀態，防止對方剛好同時搶
          const fresh = await loadState();
          if (!fresh.claimedRoles) fresh.claimedRoles = { A: false, B: false };
          if (fresh.claimedRoles[role]) {
            alert(`${state.names[role]} 已經被對方選走了，請選另一個`);
            state = fresh;
            render();
            return;
          }
          // 搶到了 → 寫回雲端
          state = fresh;
          state.claimedRoles[role] = true;
          await saveState();
          saveRole(role);
          render();
        }
      }, claimed ? `${state.names[role]}（已被對方選走）` : state.names[role]);
      opts.appendChild(btn);
    });

    wrap.appendChild(opts);

    const tip = el('div', { class: 'info-tip', style: 'margin-top: 30px; text-align: left;' });

      class: 'swap-btn',
      style: 'display: block; margin: 20px auto 0;',
      onclick: () => {
        if (confirm('離開這個房間？')) {
          clearRoom();
          render();
        }
      }
    }, '離開房間');
    wrap.appendChild(leave);

    return wrap;

  // 浮出選單
  function toggleMenu(anchor) {
    // 如果已開啟,關掉
    const existing = document.getElementById('floating-menu');
    if (existing) { existing.remove(); return; }

    const menu = el('div', {
      id: 'floating-menu',
      style: 'position: absolute; right: 16px; top: 60px; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 6px; z-index: 100; min-width: 160px;'
    });

    const makeItem = (label, onclick, danger = false) => el('button', {
      style: `display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; background: none; font-family: inherit; font-size: 14px; color: ${danger ? '#c54545' : 'var(--ink)'}; cursor: pointer; border-radius: 8px;`,
      onmouseover: function() { this.style.background = 'var(--bg)'; },
      onmouseout: function() { this.style.background = 'none'; },
      onclick: (e) => {
        e.stopPropagation();
        menu.remove();
        onclick();
      }
    }, label);

    menu.appendChild(makeItem('改名字', async () => {
      const newName = prompt('改個名字吧', state.names[myRole]);
      if (newName && newName.trim()) {
        state.names[myRole] = newName.trim().slice(0, 10);
        await saveState();
        render();
      }
    }));

    menu.appendChild(makeItem('切換身分', async () => {
      if (confirm('換成另一個身分嗎？這會把目前身分釋放給對方。')) {
        if (state.claimedRoles && myRole) {
          state.claimedRoles[myRole] = false;
          await saveState();
        }
        clearRole();
        render();
      }
    }));

    menu.appendChild(makeItem('離開房間', () => {
      if (confirm('離開房間？資料還會留在雲端，下次輸入同樣代碼就能回來，身分也會自動沿用。')) {
        clearRoom();
        render();
      }
    }, true));

    document.body.appendChild(menu);

    // 點外面關閉
    setTimeout(() => {
      const closeHandler = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeHandler);
        }
      };
      document.addEventListener('click', closeHandler);
    }, 0);
  }

  function renderPlay() {
    const wrap = el('div');

    ensureDailyProgress();
    const remaining = remainingToday();

    // 沒有當前回合
    if (!state.currentRound) {
      // 今天額度用完
      if (remaining === 0) {
        const card = el('div', { class: 'card', style: 'text-align: center; padding: 40px 20px;' });
        card.appendChild(el('div', { style: 'font-size: 36px; margin-bottom: 10px;' }, '🌙'));
        card.appendChild(el('div', { style: 'font-size: 16px; font-weight: 600; margin-bottom: 6px;' }, '今天的 3 題都答完囉'));
        card.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted);' }, '明天再來！'));
        wrap.appendChild(card);

        // 也顯示今天答了什麼
        const todayHistory = state.history.filter(h => {
          const d = new Date(h.date);
          return todayKey() === `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        });
        if (todayHistory.length > 0) {
          const sub = el('div', { class: 'card' });
          sub.appendChild(el('div', { class: 'label' }, '今日回顧'));
          todayHistory.forEach(item => {
            const row = el('div', { style: 'padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;' });
            const catInfo = CATEGORIES[item.question.cat] || CATEGORIES.daily;
            row.innerHTML = `<span style="display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: ${catInfo.bg}; color: ${catInfo.color}; margin-right: 6px; font-weight: 600;">${catInfo.name}</span><span>${escapeHtml(item.question.q)}</span>`;
            sub.appendChild(row);
          });
          // 拿掉最後一條 border
          if (sub.lastChild) sub.lastChild.style.borderBottom = 'none';
          wrap.appendChild(sub);
        }
        return wrap;
      }

      const card = el('div', { class: 'card', style: 'text-align: center; padding: 40px 20px;' });
      card.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted); margin-bottom: 4px;' },
        `今天還有 ${remaining} 題`));
      card.appendChild(el('div', { style: 'font-size: 14px; margin-bottom: 16px;' },
        remaining === DAILY_LIMIT ? '開始今天的默契挑戰' : '繼續下一題'));
      const btn = el('button', { class: 'btn', onclick: startNewRound }, '抽一題來玩');
      card.appendChild(btn);
      wrap.appendChild(card);
      return wrap;
    }

    const round = state.currentRound;
    const myData = round[myRole];
    const otherRole = myRole === 'A' ? 'B' : 'A';
    const otherData = round[otherRole];

    // 已揭曉 → 顯示結果
    if (round.revealed) {
      wrap.appendChild(renderReveal(round));
      // 額度檢查：揭曉後若已滿 3，按鈕變成提示
      const remainAfter = remainingToday();
      if (remainAfter === 0) {
        const done = el('div', { class: 'card', style: 'text-align: center; padding: 20px;' });
        done.appendChild(el('div', { style: 'font-size: 24px; margin-bottom: 6px;' }, '🌙'));
        done.appendChild(el('div', { style: 'font-size: 14px; font-weight: 600;' }, '今天的 3 題完成！'));
        done.appendChild(el('div', { style: 'font-size: 12px; color: var(--muted); margin-top: 4px;' }, '明天見～'));
        const clearBtn = el('button', {
          class: 'btn btn-ghost',
          style: 'margin-top: 12px;',
          onclick: async () => {
            state.currentRound = null;
            await saveState();
            render();
          }
        }, '關閉');
        done.appendChild(clearBtn);
        wrap.appendChild(done);
      } else {
        const btn = el('button', { class: 'btn', onclick: async () => {
          state.currentRound = null;
          await saveState();
          render();
        }}, `下一題（還剩 ${remainAfter} 題）`);
        wrap.appendChild(btn);
      }
      return wrap;
    }

    // 我已答完，等對方
    if (myData) {
      const card = el('div', { class: 'card waiting' });
      card.appendChild(el('div', { class: 'waiting-icon' }, '⏳'));
      card.appendChild(el('div', { class: 'waiting-text' }, `等 ${state.names[otherRole]} 作答…`));
      card.appendChild(el('div', { class: 'waiting-sub' }, '對方答完會自動揭曉'));
      wrap.appendChild(card);

      const refresh = el('button', {
        class: 'btn btn-ghost',
        onclick: async () => {
          state = await loadState();
          render();
        }
      }, '手動重新整理');
      wrap.appendChild(refresh);

      // 顯示我的答案
      const myCard = el('div', { class: 'card', style: 'margin-top: 14px;' });
      myCard.appendChild(el('div', { class: 'label' }, '你的選擇'));
      myCard.appendChild(el('div', { style: 'font-size: 14px; margin-bottom: 6px;' },
        `我選：${myData.answer === 'a' ? round.question.a : round.question.b}`));
      myCard.appendChild(el('div', { style: 'font-size: 14px; color: var(--muted);' },
        `猜對方：${myData.guess === 'a' ? round.question.a : round.question.b}`));
      wrap.appendChild(myCard);

      return wrap;
    }

    // 還沒答 → 答題介面
    wrap.appendChild(renderAnswerForm(round));
    return wrap;
  }

  function renderAnswerForm(round) {
    const wrap = el('div');

    const otherRole = myRole === 'A' ? 'B' : 'A';
    let myAnswer = null;
    let myGuess = null;

    // 題目卡
    const qCard = el('div', { class: 'card' });
    const catInfo = CATEGORIES[round.question.cat] || CATEGORIES.daily;
    const catRow = el('div', { style: 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;' });
    const catTag = el('span', {
      style: `font-size: 11px; padding: 3px 10px; border-radius: 10px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; letter-spacing: 0.5px;`
    }, catInfo.name);
    catRow.appendChild(catTag);
    catRow.appendChild(el('span', {
      style: 'font-size: 11px; color: var(--muted); letter-spacing: 0.8px;'
    }, `第 ${state.dailyProgress.count + 1} / ${DAILY_LIMIT} 題`));
    qCard.appendChild(catRow);
    qCard.appendChild(el('div', { class: 'question' }, round.question.q));
    wrap.appendChild(qCard);

    // Step 1: 自己的答案
    const step1 = el('div', { class: 'card' });
    step1.appendChild(el('div', { class: 'label' }, `1. 你自己會選？`));

    const opts1 = el('div', { class: 'options' });
    ['a', 'b'].forEach(key => {
      const btn = el('button', {
        class: 'option',
        onclick: () => {
          myAnswer = key;
          opts1.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          btn.classList.add('selected');
          updateSubmit();
        }
      }, round.question[key]);
      opts1.appendChild(btn);
    });
    step1.appendChild(opts1);
    wrap.appendChild(step1);

    // Step 2: 猜對方
    const step2 = el('div', { class: 'card' });
    step2.appendChild(el('div', { class: 'label' }, `2. 猜 ${state.names[otherRole]} 會選？`));

    const opts2 = el('div', { class: 'options' });
    ['a', 'b'].forEach(key => {
      const btn = el('button', {
        class: 'option',
        onclick: () => {
          myGuess = key;
          opts2.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          btn.classList.add('selected');
          updateSubmit();
        }
      }, round.question[key]);
      opts2.appendChild(btn);
    });
    step2.appendChild(opts2);
    wrap.appendChild(step2);

    const submitBtn = el('button', {
      class: 'btn',
      disabled: 'true',
      onclick: () => submitAnswer(myAnswer, myGuess)
    }, '送出');
    wrap.appendChild(submitBtn);

    function updateSubmit() {
      if (myAnswer && myGuess) {
        submitBtn.removeAttribute('disabled');
      }
    }

    return wrap;
  }

  function renderReveal(round) {
    const wrap = el('div');

    const A = round.A;
    const B = round.B;
    const isMatch = A.answer === B.answer;
    const aGotIt = A.guess === B.answer;
    const bGotIt = B.guess === A.answer;

    // Banner
    let bannerText = '';
    let bannerClass = 'reveal-banner';
    if (isMatch && aGotIt && bGotIt) {
      bannerText = '🎉 滿分！心電感應 +默契爆棚';
      bannerClass += ' match';
    } else if (isMatch) {
      bannerText = '💞 兩人選一樣！同步分 +1';
      bannerClass += ' match';
    } else if (aGotIt && bGotIt) {
      bannerText = '🎯 互相猜對！默契分各 +1';
      bannerClass += ' match';
    } else if (aGotIt || bGotIt) {
      bannerText = `🎯 ${aGotIt ? state.names.A : state.names.B} 猜對了！`;
      bannerClass += ' match';
    } else {
      bannerText = '差一點點～再接再厲';
    }

    wrap.appendChild(el('div', { class: bannerClass }, bannerText));

    // 題目
    const qCard = el('div', { class: 'card' });
    const catInfo = CATEGORIES[round.question.cat] || CATEGORIES.daily;
    const catTag = el('span', {
      style: `display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; margin-bottom: 8px;`
    }, catInfo.name);
    qCard.appendChild(catTag);
    qCard.appendChild(el('div', { class: 'question', style: 'margin-bottom: 16px;' }, round.question.q));

    // 顯示每人答案
    ['A', 'B'].forEach(role => {
      const data = round[role];
      const other = role === 'A' ? 'B' : 'A';
      const otherData = round[other];

      const row = el('div', { class: 'reveal-row' });
      row.appendChild(el('div', { class: `reveal-who who-${role.toLowerCase()}`, style: `color: var(--accent-${role.toLowerCase()})` }, state.names[role]));

      const detail = el('div', { style: 'font-size: 13px;' });
      detail.innerHTML = `選了 <strong>${data.answer === 'a' ? round.question.a : round.question.b}</strong><br><span style="color: var(--muted);">猜對方：${data.guess === 'a' ? round.question.a : round.question.b}</span>`;
      row.appendChild(detail);

      const correct = data.guess === otherData.answer;
      row.appendChild(el('div', {
        class: 'reveal-mark ' + (correct ? 'correct' : 'wrong')
      }, correct ? '✓' : '✗'));

      qCard.appendChild(row);
    });

    wrap.appendChild(qCard);

    // 即時分數
    const scoreCard = el('div', { class: 'score-grid' });
    ['A', 'B'].forEach(role => {
      const box = el('div', { class: 'score-box' });
      box.appendChild(el('div', { class: 'score-label' }, state.names[role]));
      box.appendChild(el('div', { class: 'score-num', style: `color: var(--accent-${role.toLowerCase()})` },
        `${state.scores[role].guess}`));
      box.appendChild(el('div', { class: 'score-label', style: 'margin-top: 8px;' },
        `默契 ${state.scores[role].guess} · 同步 ${state.scores[role].sync}`));
      scoreCard.appendChild(box);
    });
    wrap.appendChild(scoreCard);

    return wrap;
  }

        <div style="margin-top: 6px;">
          ${aGot ? '<span class="pill pill-guess">A 默契+1</span>' : ''}
          ${bGot ? '<span class="pill pill-guess">B 默契+1</span>' : ''}
          ${isMatch ? '<span class="pill pill-sync">同步+1</span>' : ''}
        </div>
      `;
      card.appendChild(detail);
      wrap.appendChild(card);
    });

    return wrap;
  }

  function renderAdd() {
    const wrap = el('div');

    const tip = el('div', { class: 'info-tip' });
    tip.innerHTML = '加進來的題目會混進題庫，未來抽題會抽到。建議出兩個各有支持者、不要太極端的選項，這樣猜起來才有意思 😋';
    wrap.appendChild(tip);

    const card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'label' }, '新題目'));

    const qInput = el('input', { class: 'input', placeholder: '題目，例如：晚餐想吃什麼類型' });
    const aInput = el('input', { class: 'input', placeholder: 'A 選項，例如：日式' });
    const bInput = el('input', { class: 'input', placeholder: 'B 選項，例如：泰式' });

    card.appendChild(qInput);
    card.appendChild(aInput);
    card.appendChild(bInput);

    // 分類選擇
    card.appendChild(el('div', { class: 'label', style: 'margin-top: 4px;' }, '分類'));
    let selectedCat = 'daily';
    const catGrid = el('div', { style: 'display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px;' });
    Object.entries(CATEGORIES).forEach(([key, info]) => {
      const btn = el('button', {
        style: `padding: 8px 4px; border-radius: 8px; border: 1.5px solid ${key === selectedCat ? info.color : 'var(--line)'}; background: ${key === selectedCat ? info.bg : 'var(--bg)'}; color: ${key === selectedCat ? info.color : 'var(--muted)'}; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;`,
        onclick: () => {
          selectedCat = key;
          catGrid.querySelectorAll('button').forEach((b, i) => {
            const k = Object.keys(CATEGORIES)[i];
            const ci = CATEGORIES[k];
            const isSel = k === selectedCat;
            b.style.borderColor = isSel ? ci.color : 'var(--line)';
            b.style.background = isSel ? ci.bg : 'var(--bg)';
            b.style.color = isSel ? ci.color : 'var(--muted)';
          });
        }
      }, info.name);
      catGrid.appendChild(btn);
    });
    card.appendChild(catGrid);

    const submitBtn = el('button', {
      class: 'btn',
      onclick: async () => {
        const q = qInput.value.trim();
        const a = aInput.value.trim();
        const b = bInput.value.trim();
        if (!q || !a || !b) {
          alert('三個欄位都要填喔');
          return;
        }
        state.customQuestions.push({ q, a, b, cat: selectedCat, addedBy: myRole });
        await saveState();
        qInput.value = '';
        aInput.value = '';
        bInput.value = '';
        alert('加好了！');
        render();
      }
    }, '加入題庫');
    card.appendChild(submitBtn);
    wrap.appendChild(card);

    // 列出自訂題目
    if (state.customQuestions.length > 0) {
      const listCard = el('div', { class: 'card' });
      listCard.appendChild(el('div', { class: 'label' }, `你們加的題目（${state.customQuestions.length}）`));
      state.customQuestions.forEach((q, idx) => {
        const item = el('div', {
          style: 'padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: start; gap: 10px;'
        });

        const catInfo = CATEGORIES[q.cat] || CATEGORIES.daily;
        const text = el('div', { style: 'flex: 1; font-size: 13px;' });
        text.innerHTML = `<span style="display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; margin-bottom: 4px;">${catInfo.name}</span><div style="font-weight: 600; margin-bottom: 3px;">${escapeHtml(q.q)}</div><div style="color: var(--muted);">${escapeHtml(q.a)} / ${escapeHtml(q.b)}</div>`;
        item.appendChild(text);

        const del = el('button', {
          class: 'btn btn-ghost btn-small',
          onclick: async () => {
            if (confirm('刪掉這題？')) {
              state.customQuestions.splice(idx, 1);
              await saveState();
              render();
            }
          }
        }, '刪');
        item.appendChild(del);

        listCard.appendChild(item);
      });
      wrap.appendChild(listCard);
    }

    return wrap;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ============ 啟動 ============
  async function init() {
    roomCode = loadRoom();
    myRole = loadRole();

    if (!roomCode) {
      // 還沒選房間 → 顯示房間登入畫面
      state = defaultState();
      render();
      return;
    }

    // 已有房間 → 訂閱 Firestore 即時更新
    await connectRoom(roomCode);
  }

  async function connectRoom(code) {
    roomCode = code;
    saveRoom(code);

    // 先初始載入一次
    state = await loadState();

    // 如果房間是空的（新建），寫入初始狀態
    const snap = await getDoc(doc(db, 'rooms', code));
    if (!snap.exists()) {
      await saveState();
    }

    // 自動恢復身分：如果本機 localStorage 記錄了這個房間的舊身分，
    // 而雲端也還掛著這個身分（claimedRoles[role] = true），就自動沿用
    const savedRole = loadRole();
    if (savedRole && state.claimedRoles && state.claimedRoles[savedRole]) {
      myRole = savedRole;
    } else if (savedRole && (!state.claimedRoles || !state.claimedRoles[savedRole])) {
      // 雲端沒有這個 claim（可能是房間被重置），但本機還記得 → 自動補回
      if (!state.claimedRoles) state.claimedRoles = { A: false, B: false };
      state.claimedRoles[savedRole] = true;
      myRole = savedRole;
      await saveState();
    }

    // 即時訂閱：對方一寫資料就馬上同步到本機
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(doc(db, 'rooms', code), (docSnap) => {
      if (!docSnap.exists()) return;
      const fresh = docSnap.data();

      // 自動揭曉：本機沒有揭曉、雲端有兩人答案也沒揭曉 → 由本機觸發揭曉計分
      // （任一台先觸發都會把 revealed=true 寫回，所以另一台收到時就直接同步）
      if (state.currentRound && fresh.currentRound &&
          fresh.currentRound.A && fresh.currentRound.B &&
          !fresh.currentRound.revealed && !state.currentRound.revealed) {
        state = fresh;
        doReveal();
        saveState();  // 寫回 revealed 狀態，對方會立刻收到
        render();
      } else {
        state = fresh;
        render();
      }
    });

    render();
  }

  init();
</script>
</body>
</html>
