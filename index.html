<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2a2a2a;
    --muted: #8a8378;
    --line: #ece6dc;
    --accent-a: #e07856;
    --accent-b: #6b8e9e;
    --gold: #d4a84b;
    --green: #7a9e5f;
    --soft-a: #fce8df;
    --soft-b: #dee9ed;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .who-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 600;
  }

  .who-a { background: var(--soft-a); color: var(--accent-a); }
  .who-b { background: var(--soft-b); color: var(--accent-b); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .question {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 18px;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .option {
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    transition: all 0.15s;
  }

  .option:hover { border-color: var(--ink); }
  .option.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: white;
  }
  .option.disabled { opacity: 0.5; cursor: not-allowed; }

  .step-hint {
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 8px;
    text-align: center;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--ink);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 12px;
  }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
  }
  .btn-small {
    padding: 8px 14px;
    width: auto;
    font-size: 13px;
    margin-top: 0;
  }

  .nav {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .nav button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
  }
  .nav button.active {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }

  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .score-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .score-num {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .score-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 2px;
  }

  .reveal-banner {
    background: var(--soft-a);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    text-align: center;
    font-size: 14px;
    color: var(--accent-a);
    font-weight: 600;
  }
  .reveal-banner.match { background: #e6f0db; color: var(--green); }

  .reveal-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    align-items: center;
  }
  .reveal-row:last-child { border-bottom: none; }
  .reveal-who { font-weight: 600; font-size: 12px; }
  .reveal-mark { font-size: 14px; }
  .reveal-mark.correct { color: var(--green); }
  .reveal-mark.wrong { color: var(--muted); }

  .history-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .history-q { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .history-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .history-detail { font-size: 13px; line-height: 1.6; }
  .pill {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-left: 4px;
    font-weight: 600;
  }
  .pill-guess { background: #f3e8c7; color: #8a6d1e; }
  .pill-sync { background: #dceacb; color: #4d6b35; }

  .input, .textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .input:focus, .textarea:focus { outline: none; border-color: var(--ink); }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .who-pick {
    text-align: center;
    padding: 30px 0;
  }
  .who-pick h2 {
    font-size: 24px;
    margin-bottom: 6px;
  }
  .who-pick p {
    color: var(--muted);
    margin-bottom: 30px;
    font-size: 14px;
  }
  .who-options {
    display: grid;
    gap: 12px;
  }
  .who-option {
    padding: 20px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
  }
  .who-option.a { border-color: var(--accent-a); color: var(--accent-a); }
  .who-option.b { border-color: var(--accent-b); color: var(--accent-b); }

  .waiting {
    text-align: center;
    padding: 30px 20px;
  }
  .waiting-icon {
    font-size: 36px;
    margin-bottom: 12px;
  }
  .waiting-text {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .waiting-sub {
    font-size: 13px;
    color: var(--muted);
  }

  .name-edit {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-family: inherit;
    text-decoration: underline;
  }

  .swap-btn {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    font-family: inherit;
    text-decoration: underline;
    margin-top: 8px;
  }

  .info-tip {
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }

  const DAILY_LIMIT = 5;

  // ============ 狀態管理 ============
  // ============ 房間機制 ============
  let roomCode = null;
  let unsubscribe = null;  // Firestore 訂閱取消函式

  function loadRoom() {

      return localStorage.getItem('roomCode');
    } catch { return null; }

    try { localStorage.setItem('roomCode', code); } catch {}
    roomCode = code;
  }
  function clearRoom() {
    try { localStorage.removeItem('roomCode'); } catch {}
    roomCode = null;
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  }
  let state = null;
  let myRole = null; // 'A' or 'B'
  let countdownInterval = null;  // 倒數計時器
  let dailyCountdownInterval = null;  // 「下一批題目」每分鐘更新
  let myRoundStartedQ = null;    // 我看到的是哪一題 (questionIdx)，避免重複觸發超時
  let myRoundStartTime = null;   // 我看到這題的本機時間戳 (Date.now())，計算倒數用
  let pendingAnswer = null;      // 答題畫面暫存：'a' | 'b'
  let pendingGuess = null;       // 答題畫面暫存：'a' | 'b'
  const messageDrafts = {};      // history item id -> textarea draft text
  const ROUND_TIME_LIMIT = 20;   // 秒
  let currentView = 'play'; // play | history | add | scores
  let savedNamesCache = null;

  // 從 localStorage 拿身分（跟房間綁定，不同房間身分獨立）
  function loadRole() {
    try {
      if (!roomCode) return null;
      return localStorage.getItem('role:' + roomCode);
    } catch { return null; }
  }
  function saveRole(r) {
    try {
      if (roomCode) localStorage.setItem('role:' + roomCode, r);
    } catch {}
    myRole = r;
  }
  function clearRole() {
    try {
      if (roomCode) localStorage.removeItem('role:' + roomCode);
    } catch {}

  // ============ 雲端資料 ============
  // 結構：
  // {
  //   names: { A: "玩家A", B: "玩家B" },
  //   customQuestions: [{ q, a, b, addedBy }],
  //   usedIndices: [int],      // 已用過的題目 index（內建+自訂混合排序後）
  //   currentRound: {
  //     questionIdx: int,
  //     question: {q, a, b},
  //     A: { answer: 'a'|'b', guess: 'a'|'b' } | null,
  //     B: { answer: 'a'|'b', guess: 'a'|'b' } | null,
  //     revealed: boolean
  //   } | null,
  //   scores: { A: {guess: 0, sync: 0}, B: {guess: 0, sync: 0} },
  //   history: [ { question, A: {...}, B: {...}, date } ]
  // }

  async function loadState() {
    if (!roomCode) return defaultState();
    try {
      const snap = await getDoc(doc(db, 'rooms', roomCode));
      if (snap.exists()) {
        return snap.data();
      }
    } catch (e) {
      console.error('load failed', e);
    }
    return defaultState();
  }

  function defaultState() {
    return {
      names: { A: '玩家 A', B: '玩家 B' },
      avatars: { A: '🐱', B: '🐶' },
      customQuestions: [],
      usedIndices: [],
      currentRound: null,
      scores: { A: {guess: 0, sync: 0}, B: {guess: 0, sync: 0} },
      history: [],
      dailyProgress: { date: '', count: 0 },
      claimedRoles: { A: false, B: false }
    };
  }

  // 「遊戲日」設定：每天 21:00 切換到新的一天
  const RESET_HOUR = 21;  // 24小時制，21:00 = 晚上 9 點

  // 一次性 23:10 重置 cutoff：在此時間點之後、且尚未觸發過、就強制重置一次
  // Date 用本機時區建構，台灣時間
  // 這個窗口從「23:10」到「再過 24 小時」失效，避免未來無限觸發
  const ONE_TIME_RESET_AT = new Date(2026, 5, 4, 23, 10, 0).getTime();  // 2026/6/4 23:10
  const ONE_TIME_RESET_EXPIRES = ONE_TIME_RESET_AT + 24 * 60 * 60 * 1000;

  // 取得「現在屬於哪個遊戲日」的 key
  // 規則：21:00 之前 → 算前一日；21:00 之後 → 算今日
  function todayKey() {
    const now = new Date();
    let dayStart;
    if (now.getHours() < RESET_HOUR) {
      // 還沒到 21:00 → 屬於昨天那個遊戲日
      dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    } else {
      // 已過 21:00 → 屬於今天這個遊戲日
      dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }
    return `${dayStart.getFullYear()}-${dayStart.getMonth()+1}-${dayStart.getDate()}`;
  }

  // 取得玩家頭像（兼容舊資料）
  function getAvatar(role) {
    if (state.avatars && state.avatars[role]) return state.avatars[role];
    return role === 'A' ? '🐱' : '🐶';
  }

  function ensureDailyProgress() {
    if (!state.dailyProgress) state.dailyProgress = { date: '', count: 0, plan: null, lastResetAt: 0 };
    const today = todayKey();
    const now = Date.now();

    // 一次性 23:10 重置：今天過了 23:10、且這次重置還沒做過
    const lastReset = state.dailyProgress.lastResetAt || 0;
    const inOneTimeWindow = now >= ONE_TIME_RESET_AT && now < ONE_TIME_RESET_EXPIRES;
    const needsOneTimeReset = inOneTimeWindow && lastReset < ONE_TIME_RESET_AT;

    if (state.dailyProgress.date !== today || needsOneTimeReset) {
      // 新的一天 or 一次性重置：生成今日抽題計畫
      state.dailyProgress = {
        date: today,
        count: 0,
        plan: shuffle(['deep', 'custom', 'random', 'random', 'random']),
        lastResetAt: now
      };
    }
    // 兼容舊資料（之前沒 plan 欄位）
    if (!state.dailyProgress.plan) {
      state.dailyProgress.plan = shuffle(['deep', 'custom', 'random', 'random', 'random']);
    }
  }

  // Fisher-Yates 洗牌
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 算到下一個「重置時間點」還剩多少時間，回傳「XX 小時 XX 分」格式
  function timeUntilMidnight() {
    const now = new Date();
    let nextReset;
    if (now.getHours() < RESET_HOUR) {
      // 還沒到今天的 21:00
      nextReset = new Date(now.getFullYear(), now.getMonth(), now.getDate(), RESET_HOUR, 0, 0);
    } else {
      // 已過 21:00 → 明天的 21:00
      nextReset = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, RESET_HOUR, 0, 0);
    }
    const diffMs = nextReset - now;
    const totalMinutes = Math.ceil(diffMs / 60000);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    if (hours === 0) {
      return `${minutes} 分`;
    }
    return `${hours} 小時 ${minutes} 分`;
  }

  function remainingToday() {
    ensureDailyProgress();
    return Math.max(0, DAILY_LIMIT - state.dailyProgress.count);
  }

  async function saveState() {
    if (!roomCode) return;
    try {
      await setDoc(doc(db, 'rooms', roomCode), state);
    } catch (e) {
      console.error('save failed', e);
    }
  }

  // ============ 題目池 ============
  function getAllQuestions() {
    return [
      ...BUILTIN_QUESTIONS.map(q => ({...q, source: 'builtin'})),
      ...state.customQuestions.map(q => ({...q, source: 'custom'}))
    ];
  }

  // 依今日計畫選一題。如果計畫指定 custom 但題庫不夠，回傳 { needCustom: true }
  function pickNewQuestion() {
    ensureDailyProgress();
    const slotType = state.dailyProgress.plan[state.dailyProgress.count] || 'random';

    const all = getAllQuestions();

    // 過濾出符合 slot 類型且還沒用過的
    let pool;
    if (slotType === 'deep') {
      pool = all
        .map((q, i) => ({q, i}))
        .filter(x => x.q.cat === 'deep' && !state.usedIndices.includes(x.i));
      if (pool.length === 0) {
        // 深度題用完了 → 從深度題池子重置（只重置深度，不動其他類別）
        const allDeepIndices = all
          .map((q, i) => ({q, i}))
          .filter(x => x.q.cat === 'deep')
          .map(x => x.i);
        state.usedIndices = state.usedIndices.filter(i => !allDeepIndices.includes(i));
        pool = all
          .map((q, i) => ({q, i}))
          .filter(x => x.q.cat === 'deep' && !state.usedIndices.includes(x.i));
      }
    } else if (slotType === 'custom') {
      pool = all
        .map((q, i) => ({q, i}))
        .filter(x => x.q.source === 'custom' && !state.usedIndices.includes(x.i));
      if (pool.length === 0) {
        // 自訂題不夠 → 回報給上層處理（提示使用者）
        return { needCustom: true };
      }
    } else {
      // random：從整個池子隨機（排除已用）
      pool = all
        .map((q, i) => ({q, i}))
        .filter(x => !state.usedIndices.includes(x.i));
      if (pool.length === 0) {
        // 全部答過了，重設所有
        state.usedIndices = [];
        pool = all.map((q, i) => ({q, i}));
      }
    }

    const pick = pool[Math.floor(Math.random() * pool.length)];
    return { index: pick.i, question: pick.q };
  }

  async function startNewRound() {
    // 先撈雲端最新版，避免覆蓋對方剛留言/改頭像/加題等
    const fresh = await loadState();
    state = fresh;

    // 如果對方已經抽好新題了（rare race），就用對方那題不要覆蓋
    if (state.currentRound) {
      render();
      return;
    }

    const picked = pickNewQuestion();

    // 自訂題不夠 → 提示
    if (picked.needCustom) {
      alert('今天輪到自訂題了，但題庫不夠用 🥺\n去「加題」頁新增幾題吧！');
      render();  // 不抽題、停在原畫面
      return;
    }

    state.currentRound = {
      questionIdx: picked.index,
      question: {
        q: picked.question.q,
        a: picked.question.a,
        b: picked.question.b,
        cat: picked.question.cat || 'daily'
      },
      A: null,
      B: null,
      revealed: false,
      startedAt: Date.now(),
      timedOut: false,
      ackedBy: { A: false, B: false }
    };
    state.usedIndices.push(picked.index);
    await saveState();
    render();
  }

  async function submitAnswer(answer, guess) {
    if (!state.currentRound) return;

    // 答完了 → 停止倒數、清掉自己這題的時間紀錄
    stopCountdown();
    myRoundStartedQ = null;
    myRoundStartTime = null;

    // 重要：在寫入前先從雲端撈最新狀態，避免覆蓋對方剛寫入的答案
    const fresh = await loadState();
    if (!fresh.currentRound) {
      // 雲端的回合資料消失了（罕見），回退到本地
      state.currentRound[myRole] = { answer, guess };
    } else {
      // 用雲端版本當基底，只把自己的答案塞進去
      state = fresh;
      state.currentRound[myRole] = { answer, guess };
    }

    // 兩人都答完 → 由本機執行揭曉
    if (state.currentRound.A && state.currentRound.B && !state.currentRound.revealed) {
      doReveal();
    }

    await saveState();
    render();
  }

  // 揭曉 + 計分（只在 currentRound.revealed 還是 false 時才執行）
  function doReveal() {
    if (!state.currentRound || state.currentRound.revealed) return;
    const A = state.currentRound.A;
    const B = state.currentRound.B;
    if (!A || !B) return;

    state.currentRound.revealed = true;

    if (A.guess === B.answer) state.scores.A.guess++;
    if (B.guess === A.answer) state.scores.B.guess++;
    if (A.answer === B.answer) {
      state.scores.A.sync++;
      state.scores.B.sync++;
    }

    state.history.unshift({
      id: `h_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,
      question: state.currentRound.question,
      A: { ...A },
      B: { ...B },
      date: new Date().toISOString(),
      messages: [],          // { by: 'A'|'B', text: string, at: ISO }
      wantDiscuss: { A: false, B: false }
    });
    state.history = state.history.slice(0, 100);

    ensureDailyProgress();
    state.dailyProgress.count++;
  }

  // 揭曉後使用者按「下一題」：標記自己看完、兩人都看完才清掉 currentRound
  async function ackAndAdvance() {
    // 先撈雲端最新狀態
    const fresh = await loadState();
    if (!fresh.currentRound || !fresh.currentRound.revealed) {
      // 雲端狀態異常，回退處理
      state = fresh;
      render();
      return;
    }

    state = fresh;
    if (!state.currentRound.ackedBy) state.currentRound.ackedBy = { A: false, B: false };
    state.currentRound.ackedBy[myRole] = true;

    const otherRole = myRole === 'A' ? 'B' : 'A';
    if (state.currentRound.ackedBy[otherRole]) {
      // 雙方都看過了 → 清掉這題
      state.currentRound = null;
    }

    await saveState();
    render();
  }

  // ============ 渲染 ============
  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'onclick') e.onclick = v;
      else if (k === 'oninput') e.oninput = v;
      else if (k === 'onchange') e.onchange = v;
      else if (k === 'html') e.innerHTML = v;
      else e.setAttribute(k, v);
    }
    if (typeof children === 'string') e.textContent = children;
    else children.forEach(c => c && e.appendChild(c));
    return e;
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    // 還沒選房間 → 顯示房間選擇畫面
    if (!roomCode) {
      app.appendChild(renderRoomPick());
      return;
    }

    // 如果還沒選身分
    if (!myRole) {
      app.appendChild(renderWhoPick());
      return;
    }

    app.appendChild(renderHeader());
    app.appendChild(renderNav());

    if (currentView === 'play') app.appendChild(renderPlay());
    else if (currentView === 'scores') app.appendChild(renderScores());
    else if (currentView === 'history') app.appendChild(renderHistory());
    else if (currentView === 'review') app.appendChild(renderReview());
    else if (currentView === 'add') app.appendChild(renderAdd());
  }

  // 浮出選單
  function toggleMenu(anchor) {
    // 如果已開啟,關掉
    const existing = document.getElementById('floating-menu');
    if (existing) { existing.remove(); return; }

    const menu = el('div', {
      id: 'floating-menu',
      style: 'position: absolute; right: 16px; top: 60px; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 6px; z-index: 100; min-width: 160px;'
    });

    const makeItem = (label, onclick, danger = false) => el('button', {
      style: `display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; background: none; font-family: inherit; font-size: 14px; color: ${danger ? '#c54545' : 'var(--ink)'}; cursor: pointer; border-radius: 8px;`,
      onmouseover: function() { this.style.background = 'var(--bg)'; },
      onmouseout: function() { this.style.background = 'none'; },
      onclick: (e) => {
        e.stopPropagation();
        menu.remove();
        onclick();
      }
    }, label);

    menu.appendChild(makeItem('改名字', async () => {
      const newName = prompt('改個名字吧', state.names[myRole]);
      if (newName && newName.trim()) {
        const fresh = await loadState();
        state = fresh;
        state.names[myRole] = newName.trim().slice(0, 10);
        await saveState();
        render();
      }
    }));

    menu.appendChild(makeItem('改頭像', () => {
      showEmojiPicker();
    }));

    menu.appendChild(makeItem('切換身分', async () => {
      if (await customConfirm('換成另一個身分嗎？這會把目前身分釋放給對方。')) {
        const fresh = await loadState();
        state = fresh;
        if (state.claimedRoles && myRole) {
          state.claimedRoles[myRole] = false;
          await saveState();
        }
        clearRole();
        render();
      }
    }));

    menu.appendChild(makeItem('離開房間', async () => {
      if (await customConfirm('離開房間？資料還會留在雲端，下次輸入同樣代碼就能回來，身分也會自動沿用。')) {
        clearRoom();
        render();
      }
    }, true));

    document.body.appendChild(menu);

    // 點外面關閉
    setTimeout(() => {
      const closeHandler = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeHandler);
        }
      };
      document.addEventListener('click', closeHandler);
    }, 0);
  }

  // Emoji 頭像選擇器（模態視窗）
  // 自訂確認對話框（取代 native confirm，避免 PWA 模式下 confirm 失效）
  function customConfirm(message, opts = {}) {
    return new Promise((resolve) => {
      // 清掉舊的
      const old = document.getElementById('confirm-modal');
      if (old) old.remove();

      const overlay = el('div', {
        id: 'confirm-modal',
        style: 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px;'
      });

      const modal = el('div', {
        style: 'background: white; border-radius: 18px; padding: 22px; max-width: 340px; width: 100%;'
      });

      const msg = el('div', {
        style: 'font-size: 15px; line-height: 1.6; margin-bottom: 18px; color: var(--ink); white-space: pre-wrap;'
      }, message);
      modal.appendChild(msg);

      const btnRow = el('div', { style: 'display: flex; gap: 8px;' });

      const cancelBtn = el('button', {
        class: 'btn btn-ghost',
        style: 'flex: 1; margin: 0;',
        onclick: () => { overlay.remove(); resolve(false); }
      }, opts.cancelText || '取消');

      const okBtn = el('button', {
        class: 'btn',
        style: `flex: 1; margin: 0; ${opts.danger ? 'background: #c54545;' : ''}`,
        onclick: () => { overlay.remove(); resolve(true); }
      }, opts.okText || '確定');

      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(okBtn);
      modal.appendChild(btnRow);

      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    });
  }

  function renderPlay() {
    const wrap = el('div');

    ensureDailyProgress();
    const remaining = remainingToday();

    // 沒有當前回合
    if (!state.currentRound) {
      // 今天額度用完
      if (remaining === 0) {
        startDailyCountdown();  // 啟動每分鐘更新
        const card = el('div', { class: 'card', style: 'text-align: center; padding: 40px 20px;' });
        card.appendChild(el('div', { style: 'font-size: 36px; margin-bottom: 10px;' }, '🌙'));
        card.appendChild(el('div', { style: 'font-size: 16px; font-weight: 600; margin-bottom: 6px;' }, `今天的 ${DAILY_LIMIT} 題都答完囉`));
        card.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted); margin-bottom: 14px;' }, '明天再來！'));

        // 倒數到下一批題目
        const countdown = el('div', {
          style: 'background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; display: inline-block;'
        });
        countdown.appendChild(el('div', {
          style: 'font-size: 11px; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 4px;'
        }, '距離下一批題目'));
        countdown.appendChild(el('div', {
          style: 'font-size: 15px; font-weight: 700; color: var(--accent-a);'
        }, `⏳ ${timeUntilMidnight()}`));
        card.appendChild(countdown);

        wrap.appendChild(card);

        // 也顯示今天答了什麼
        const todayHistory = state.history.filter(h => {
          const d = new Date(h.date);
          return todayKey() === `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
        });
        if (todayHistory.length > 0) {
          const sub = el('div', { class: 'card' });
          sub.appendChild(el('div', { class: 'label' }, '今日回顧'));
          todayHistory.forEach(item => {
            const row = el('div', { style: 'padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;' });
            const catInfo = CATEGORIES[item.question.cat] || CATEGORIES.daily;
            row.innerHTML = `<span style="display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: ${catInfo.bg}; color: ${catInfo.color}; margin-right: 6px; font-weight: 600;">${catInfo.name}</span><span>${escapeHtml(item.question.q)}</span>`;
            sub.appendChild(row);
          });
          // 拿掉最後一條 border
          if (sub.lastChild) sub.lastChild.style.borderBottom = 'none';
          wrap.appendChild(sub);
        }
        return wrap;
      }

      const card = el('div', { class: 'card', style: 'text-align: center; padding: 40px 20px;' });
      card.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted); margin-bottom: 4px;' },
        `今天還有 ${remaining} 題`));
      card.appendChild(el('div', { style: 'font-size: 14px; margin-bottom: 16px;' },
        remaining === DAILY_LIMIT ? '開始今天的默契挑戰' : '繼續下一題'));

      // 預先檢查：下一題如果是自訂題但題庫不夠，先警告
      const nextSlot = state.dailyProgress.plan && state.dailyProgress.plan[state.dailyProgress.count];
      const allQs = getAllQuestions();
      const availableCustom = allQs
        .map((q, i) => ({q, i}))
        .filter(x => x.q.source === 'custom' && !state.usedIndices.includes(x.i));

      if (nextSlot === 'custom' && availableCustom.length === 0) {
        const warn = el('div', {
          style: 'background: #fff5e6; border: 1px dashed var(--gold); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 13px; color: #8a6d1e; line-height: 1.6;'
        });
        warn.innerHTML = '⚠️ 今天輪到自訂題了，但題庫不夠用 🥺<br>去「加題」頁新增幾題吧！';
        card.appendChild(warn);

        const goAddBtn = el('button', {
          class: 'btn',
          onclick: () => { currentView = 'add'; render(); }
        }, '去加題');
        card.appendChild(goAddBtn);
      } else {
        const btn = el('button', { class: 'btn', onclick: startNewRound }, '抽一題來玩');
        card.appendChild(btn);
      }

      wrap.appendChild(card);
      return wrap;
    }

    const round = state.currentRound;
    const myData = round[myRole];
    const otherRole = myRole === 'A' ? 'B' : 'A';
    const otherData = round[otherRole];

    // 超時 → 雙方都顯示通知並等對方按了解
    if (round.timedOut) {
      stopCountdown();
      myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
      if (!round.timeoutAckedBy) round.timeoutAckedBy = { A: false, B: false };
      const iAcked = round.timeoutAckedBy[myRole];
      const otherAcked = round.timeoutAckedBy[otherRole];

      const timeoutCard = el('div', { class: 'card', style: 'text-align: center; padding: 30px 20px;' });
      timeoutCard.appendChild(el('div', { style: 'font-size: 36px; margin-bottom: 10px;' }, '⏱️'));

      const whoTimedOut = round.timedOutBy;
      const isMe = whoTimedOut === myRole;
      timeoutCard.appendChild(el('div', { style: 'font-size: 15px; font-weight: 600; margin-bottom: 6px;' },
        isMe ? '時間到了！' : `${getAvatar(whoTimedOut)} ${state.names[whoTimedOut]} 超時了`));
      timeoutCard.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted); margin-bottom: 16px;' },
        '這題作廢，不算今日進度'));

      if (iAcked && !otherAcked) {
        timeoutCard.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted);' },
          `等 ${getAvatar(otherRole)} ${state.names[otherRole]} 看完…`));
      } else {
        const btn = el('button', {
          class: 'btn',
          onclick: async () => {
            const fresh = await loadState();
            if (!fresh.currentRound) {
              state = fresh;
              render();
              return;
            }
            if (!fresh.currentRound.timeoutAckedBy) fresh.currentRound.timeoutAckedBy = { A: false, B: false };
            fresh.currentRound.timeoutAckedBy[myRole] = true;
            // 兩人都看過 → 清掉這回合
            if (fresh.currentRound.timeoutAckedBy[otherRole]) {
              fresh.currentRound = null;
            }
            state = fresh;
            await saveState();
            render();
          }
        }, '了解');
        timeoutCard.appendChild(btn);
      }
      wrap.appendChild(timeoutCard);
      return wrap;
    }

    // 已揭曉 → 顯示結果
    if (round.revealed) {
      stopCountdown();
      myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
      wrap.appendChild(renderReveal(round));

      // 確保 ackedBy 存在
      if (!round.ackedBy) round.ackedBy = { A: false, B: false };
      const iAcked = round.ackedBy[myRole];
      const otherAcked = round.ackedBy[otherRole];

      // 額度檢查：揭曉後若已滿 3，按鈕變成提示
      const remainAfter = remainingToday();

      if (iAcked && !otherAcked) {
        // 我已經按過下一題，但對方還沒 → 等對方
        const wait = el('div', { class: 'card', style: 'text-align: center; padding: 20px;' });
        wait.appendChild(el('div', { style: 'font-size: 13px; color: var(--muted);' },
          `等 ${getAvatar(otherRole)} ${state.names[otherRole]} 看完揭曉…`));
        wrap.appendChild(wait);
        return wrap;
      }

      if (remainAfter === 0) {
        startDailyCountdown();
        const done = el('div', { class: 'card', style: 'text-align: center; padding: 20px;' });
        done.appendChild(el('div', { style: 'font-size: 24px; margin-bottom: 6px;' }, '🌙'));
        done.appendChild(el('div', { style: 'font-size: 14px; font-weight: 600;' }, `今天的 ${DAILY_LIMIT} 題完成！`));
        done.appendChild(el('div', { style: 'font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 12px;' }, '明天見～'));

        const countdown = el('div', {
          style: 'background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 14px; display: inline-block; margin-bottom: 4px;'
        });
        countdown.appendChild(el('div', {
          style: 'font-size: 10px; color: var(--muted); letter-spacing: 0.8px; margin-bottom: 3px;'
        }, '距離下一批題目'));
        countdown.appendChild(el('div', {
          style: 'font-size: 14px; font-weight: 700; color: var(--accent-a);'
        }, `⏳ ${timeUntilMidnight()}`));
        done.appendChild(countdown);

        const clearBtn = el('button', {
          class: 'btn btn-ghost',
          style: 'margin-top: 12px;',
          onclick: async () => {
            await ackAndAdvance();
          }
        }, '關閉');
        done.appendChild(clearBtn);
        wrap.appendChild(done);
      } else {
        const btn = el('button', { class: 'btn', onclick: async () => {
          await ackAndAdvance();
        }}, `下一題（還剩 ${remainAfter} 題）`);
        wrap.appendChild(btn);
      }
      return wrap;
    }

    // 我已答完，等對方
    if (myData) {
      stopCountdown();
      const card = el('div', { class: 'card waiting' });
      card.appendChild(el('div', { class: 'waiting-icon' }, '⏳'));
      card.appendChild(el('div', { class: 'waiting-text' }, `等 ${getAvatar(otherRole)} ${state.names[otherRole]} 作答…`));
      card.appendChild(el('div', { class: 'waiting-sub' }, '對方答完會自動揭曉'));
      wrap.appendChild(card);

      const refresh = el('button', {
        class: 'btn btn-ghost',
        onclick: async () => {
          state = await loadState();
          render();
        }
      }, '手動重新整理');
      wrap.appendChild(refresh);

      // 顯示我的答案
      const myCard = el('div', { class: 'card', style: 'margin-top: 14px;' });
      myCard.appendChild(el('div', { class: 'label' }, '你的選擇'));
      myCard.appendChild(el('div', { style: 'font-size: 14px; margin-bottom: 6px;' },
        `我選：${myData.answer === 'a' ? round.question.a : round.question.b}`));
      myCard.appendChild(el('div', { style: 'font-size: 14px; color: var(--muted);' },
        `猜對方：${myData.guess === 'a' ? round.question.a : round.question.b}`));
      wrap.appendChild(myCard);

      return wrap;
    }

    // 還沒答 → 答題介面
    wrap.appendChild(renderAnswerForm(round));
    return wrap;
  }

  function renderAnswerForm(round) {
    const wrap = el('div');

    const otherRole = myRole === 'A' ? 'B' : 'A';

    // 如果換到新題目，清掉暫存
    if (myRoundStartedQ !== round.questionIdx) {
      pendingAnswer = null;
      pendingGuess = null;
      myRoundStartTime = null;  // 讓下面 startCountdown 用新的開始時間
    }

    // 倒數條容器（放在最上面）
    const timerWrap = el('div', {
      style: 'margin-bottom: 14px;'
    });
    const timerLabel = el('div', {
      style: 'display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px;'
    });
    const timerText = el('span', {}, `⏱️ 剩餘時間`);
    const timerCount = el('span', { style: 'font-weight: 700; color: var(--ink);' }, `${ROUND_TIME_LIMIT}s`);
    timerLabel.appendChild(timerText);
    timerLabel.appendChild(timerCount);
    timerWrap.appendChild(timerLabel);

    const timerBar = el('div', {
      style: 'height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;'
    });
    const timerFill = el('div', {
      style: 'height: 100%; width: 100%; background: var(--green); border-radius: 3px; transition: width 0.95s linear, background-color 0.3s;'
    });
    timerBar.appendChild(timerFill);
    timerWrap.appendChild(timerBar);
    wrap.appendChild(timerWrap);

    // 題目卡
    const qCard = el('div', { class: 'card' });
    const catInfo = CATEGORIES[round.question.cat] || CATEGORIES.daily;
    const catRow = el('div', { style: 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;' });
    const catTag = el('span', {
      style: `font-size: 11px; padding: 3px 10px; border-radius: 10px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; letter-spacing: 0.5px;`
    }, catInfo.name);
    catRow.appendChild(catTag);
    catRow.appendChild(el('span', {
      style: 'font-size: 11px; color: var(--muted); letter-spacing: 0.8px;'
    }, `第 ${state.dailyProgress.count + 1} / ${DAILY_LIMIT} 題`));
    qCard.appendChild(catRow);
    qCard.appendChild(el('div', { class: 'question' }, round.question.q));
    wrap.appendChild(qCard);

    // Step 1: 自己的答案
    const step1 = el('div', { class: 'card' });
    step1.appendChild(el('div', { class: 'label' }, `1. 你自己會選？`));

    const opts1 = el('div', { class: 'options' });
    ['a', 'b'].forEach(key => {
      const btn = el('button', {
        class: 'option' + (pendingAnswer === key ? ' selected' : ''),
        onclick: () => {
          pendingAnswer = key;
          opts1.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          btn.classList.add('selected');
          updateSubmit();
        }
      }, round.question[key]);
      opts1.appendChild(btn);
    });
    step1.appendChild(opts1);
    wrap.appendChild(step1);

    // Step 2: 猜對方
    const step2 = el('div', { class: 'card' });
    step2.appendChild(el('div', { class: 'label' }, `2. 猜 ${getAvatar(otherRole)} ${state.names[otherRole]} 會選？`));

    const opts2 = el('div', { class: 'options' });
    ['a', 'b'].forEach(key => {
      const btn = el('button', {
        class: 'option' + (pendingGuess === key ? ' selected' : ''),
        onclick: () => {
          pendingGuess = key;
          opts2.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          btn.classList.add('selected');
          updateSubmit();
        }
      }, round.question[key]);
      opts2.appendChild(btn);
    });
    step2.appendChild(opts2);
    wrap.appendChild(step2);

    const submitBtn = el('button', {
      class: 'btn',
      onclick: () => {
        if (!pendingAnswer || !pendingGuess) return;
        stopCountdown();
        const a = pendingAnswer, g = pendingGuess;
        pendingAnswer = null;
        pendingGuess = null;
        submitAnswer(a, g);
      }
    }, '送出');
    if (!pendingAnswer || !pendingGuess) {
      submitBtn.setAttribute('disabled', 'true');
    }
    wrap.appendChild(submitBtn);

    function updateSubmit() {
      if (pendingAnswer && pendingGuess) {
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.setAttribute('disabled', 'true');
      }
    }

    // 啟動倒數（用真實時間扣，不會被 re-render 重置）
    if (myRoundStartedQ !== round.questionIdx) {
      myRoundStartedQ = round.questionIdx;
      myRoundStartTime = Date.now();
    }
    startCountdown(timerFill, timerCount);

    return wrap;
  }

  function stopCountdown() {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }

  // 每分鐘更新一次「距離下一批題目」倒數
  function startDailyCountdown() {
    if (dailyCountdownInterval) return;  // 已經在跑就不重複啟動
    dailyCountdownInterval = setInterval(() => {
      // 如果切到別的畫面（不是「今日且額度用完」），停掉
      if (currentView !== 'play') {
        stopDailyCountdown();
        return;
      }
      ensureDailyProgress();
      if (remainingToday() > 0) {
        // 午夜過了、額度重置 → 停掉倒數、重新渲染
        stopDailyCountdown();
        render();
        return;
      }
      // 還是答完的狀態 → 更新倒數
      render();
    }, 60000);  // 每分鐘更新
  }

  function stopDailyCountdown() {
    if (dailyCountdownInterval) {
      clearInterval(dailyCountdownInterval);
      dailyCountdownInterval = null;
    }
  }

  function startCountdown(fillEl, textEl) {
    stopCountdown();
    if (!myRoundStartTime) myRoundStartTime = Date.now();

    function tick() {
      const elapsed = (Date.now() - myRoundStartTime) / 1000;
      const seconds = Math.max(0, Math.ceil(ROUND_TIME_LIMIT - elapsed));
      const pct = (seconds / ROUND_TIME_LIMIT) * 100;
      fillEl.style.width = pct + '%';
      if (seconds > 10) {
        fillEl.style.background = 'var(--green)';
      } else if (seconds > 5) {
        fillEl.style.background = 'var(--gold)';
      } else {
        fillEl.style.background = '#c54545';
      }
      textEl.textContent = `${seconds}s`;
      textEl.style.color = seconds <= 5 ? '#c54545' : 'var(--ink)';

      if (elapsed >= ROUND_TIME_LIMIT) {
        stopCountdown();
        handleTimeout();
      }
    }

    tick();  // 立即更新一次以反映已過時間
    countdownInterval = setInterval(tick, 250);  // 250ms 更新一次比較流暢
  }

  async function handleTimeout() {
    // 標記這題已超時，由本機觸發作廢；由雙方各自按「了解」後清掉
    if (!state.currentRound) return;
    const fresh = await loadState();
    if (!fresh.currentRound || fresh.currentRound.questionIdx !== myRoundStartedQ) {
      // 雲端已換題或被作廢，不處理
      myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
      return;
    }
    if (fresh.currentRound.revealed) {
      // 已揭曉就不算超時
      myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
      return;
    }
    if (fresh.currentRound.timedOut) {
      // 對方已先超時（或已標記），不重複觸發
      myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
      state = fresh;
      render();
      return;
    }
    fresh.currentRound.timedOut = true;
    fresh.currentRound.timedOutBy = myRole;
    fresh.currentRound.timeoutAckedBy = { A: false, B: false };
    state = fresh;
    myRoundStartedQ = null; myRoundStartTime = null; pendingAnswer = null; pendingGuess = null;
    await saveState();
    // 不再彈 alert，讓畫面切到「超時」狀態（雙方都看得到）
    render();
  }

  function renderReveal(round) {
    const wrap = el('div');

    const A = round.A;
    const B = round.B;
    const isMatch = A.answer === B.answer;
    const aGotIt = A.guess === B.answer;
    const bGotIt = B.guess === A.answer;

    // Banner
    let bannerText = '';
    let bannerClass = 'reveal-banner';
    if (isMatch && aGotIt && bGotIt) {
      bannerText = '🎉 滿分！心電感應 +默契爆棚';
      bannerClass += ' match';
    } else if (isMatch) {
      bannerText = '💞 兩人選一樣！同步分 +1';
      bannerClass += ' match';
    } else if (aGotIt && bGotIt) {
      bannerText = '🎯 互相猜對！默契分各 +1';
      bannerClass += ' match';
    } else if (aGotIt || bGotIt) {
      const who = aGotIt ? 'A' : 'B';
      bannerText = `🎯 ${getAvatar(who)} ${state.names[who]} 猜對了！`;
      bannerClass += ' match';
    } else {
      bannerText = '差一點點～再接再厲';
    }

    wrap.appendChild(el('div', { class: bannerClass }, bannerText));

    // 題目
    const qCard = el('div', { class: 'card' });
    const catInfo = CATEGORIES[round.question.cat] || CATEGORIES.daily;
    const catTag = el('span', {
      style: `display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; margin-bottom: 8px;`
    }, catInfo.name);
    qCard.appendChild(catTag);
    qCard.appendChild(el('div', { class: 'question', style: 'margin-bottom: 16px;' }, round.question.q));

    // 顯示每人答案
    ['A', 'B'].forEach(role => {
      const data = round[role];
      const other = role === 'A' ? 'B' : 'A';
      const otherData = round[other];

      const row = el('div', { class: 'reveal-row' });
      row.appendChild(el('div', { class: `reveal-who who-${role.toLowerCase()}`, style: `color: var(--accent-${role.toLowerCase()})` }, `${getAvatar(role)} ${state.names[role]}`));

      const detail = el('div', { style: 'font-size: 13px;' });
      detail.innerHTML = `選了 <strong>${data.answer === 'a' ? round.question.a : round.question.b}</strong><br><span style="color: var(--muted);">猜對方：${data.guess === 'a' ? round.question.a : round.question.b}</span>`;
      row.appendChild(detail);

      const correct = data.guess === otherData.answer;
      row.appendChild(el('div', {
        class: 'reveal-mark ' + (correct ? 'correct' : 'wrong')
      }, correct ? '✓' : '✗'));

      qCard.appendChild(row);
    });

    wrap.appendChild(qCard);

    // 即時分數
    const scoreCard = el('div', { class: 'score-grid' });
    ['A', 'B'].forEach(role => {
      const box = el('div', { class: 'score-box' });
      box.appendChild(el('div', { class: 'score-label' }, `${getAvatar(role)} ${state.names[role]}`));
      box.appendChild(el('div', { class: 'score-num', style: `color: var(--accent-${role.toLowerCase()})` },
        `${state.scores[role].guess}`));
      box.appendChild(el('div', { class: 'score-label', style: 'margin-top: 8px;' },
        `默契 ${state.scores[role].guess} · 同步 ${state.scores[role].sync}`));
      scoreCard.appendChild(box);
    });
    wrap.appendChild(scoreCard);

    // 留言 + 想討論這題（用 history[0] 當作這題的 anchor）
    const historyItem = state.history[0];  // 剛揭曉的這題會在最上面
    if (historyItem) {
      wrap.appendChild(renderHistoryActions(historyItem, true));
    }

    return wrap;
  }

  // 共用：留言 + 想討論的 UI（揭曉、歷史紀錄都會用到）
  function renderHistoryActions(item, expanded) {
    const wrap = el('div', { style: 'margin-bottom: 14px;' });

    if (!item.messages) item.messages = [];
    if (!item.wantDiscuss) item.wantDiscuss = { A: false, B: false };

    const otherRole = myRole === 'A' ? 'B' : 'A';
    const iWantDiscuss = item.wantDiscuss[myRole];
    const otherWantDiscuss = item.wantDiscuss[otherRole];
    const anyDiscuss = iWantDiscuss || otherWantDiscuss;

    // 兩顆動作按鈕
    const btnRow = el('div', { style: 'display: flex; gap: 8px; margin-bottom: 10px;' });

    const msgBtn = el('button', {
      class: 'btn btn-ghost',
      style: 'margin: 0; padding: 10px; font-size: 12px; flex: 1;',
      onclick: () => {
        toggleMessageBox(item, msgArea);
      }
    }, item.messages.length > 0 ? `💬 留言 (${item.messages.length})` : '💬 留言給對方');
    btnRow.appendChild(msgBtn);

    const discussBtn = el('button', {
      class: 'btn btn-ghost',
      style: `margin: 0; padding: 10px; font-size: 12px; flex: 1; ${iWantDiscuss ? 'background: var(--soft-a); border-color: var(--accent-a); color: var(--accent-a);' : ''}`,
      onclick: async () => {
        // 先撈雲端最新版避免覆蓋
        const fresh = await loadState();
        const freshItem = findHistoryItemById(fresh, item.id);
        if (!freshItem) return;
        if (!freshItem.wantDiscuss) freshItem.wantDiscuss = { A: false, B: false };
        freshItem.wantDiscuss[myRole] = !freshItem.wantDiscuss[myRole];
        state = fresh;
        await saveState();
        render();
      }
    }, iWantDiscuss ? '🔖 已標記討論' : '🔖 想討論這題');
    btnRow.appendChild(discussBtn);

    wrap.appendChild(btnRow);

    // 對方標記了「想討論」的提示
    if (otherWantDiscuss && !iWantDiscuss) {
      const hint = el('div', {
        style: 'background: #fff5e6; border: 1px dashed var(--gold); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #8a6d1e; margin-bottom: 10px;'
      }, `🔖 ${getAvatar(otherRole)} ${state.names[otherRole]} 想討論這題`);
      wrap.appendChild(hint);
    }

    // 留言區（預設依 expanded 參數決定要不要展開；有草稿時自動展開）
    const hasDraft = !!messageDrafts[item.id];
    const shouldExpand = expanded || item.messages.length > 0 || hasDraft;
    const msgArea = el('div', { style: shouldExpand ? '' : 'display: none;' });
    wrap.appendChild(msgArea);
    renderMessageArea(item, msgArea);

    return wrap;
  }

  function toggleMessageBox(item, msgArea) {
    if (msgArea.style.display === 'none') {
      msgArea.style.display = '';
    } else {
      // 已展開且沒留言 → 收起；有留言則一直展開
      if (item.messages.length === 0) {
        msgArea.style.display = 'none';
      }
    }
    renderMessageArea(item, msgArea);
  }

  function renderMessageArea(item, container) {
    container.innerHTML = '';

    // 訊息列表
    item.messages.forEach(msg => {
      const isMine = msg.by === myRole;
      const otherRole = msg.by === 'A' ? 'B' : 'A';
      const bubble = el('div', {
        style: `background: ${msg.by === 'A' ? 'var(--soft-a)' : 'var(--soft-b)'}; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: ${msg.by === 'A' ? '#5a3a2a' : '#2f4a55'}; line-height: 1.5;`
      });
      const from = el('div', {
        style: 'font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.7;'
      }, isMine ? `${getAvatar(msg.by)} 我` : `${getAvatar(msg.by)} ${state.names[msg.by]}`);
      bubble.appendChild(from);
      bubble.appendChild(document.createTextNode(msg.text));
      container.appendChild(bubble);
    });

    // 輸入區
    const inputWrap = el('div', { style: 'margin-top: 8px;' });
    const textarea = el('textarea', {
      placeholder: '留言給對方...',
      style: 'width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; font-family: inherit; resize: none; height: 56px; background: var(--bg);',
      oninput: function() {
        messageDrafts[item.id] = this.value;
      }
    });
    // 恢復草稿
    if (messageDrafts[item.id]) {
      textarea.value = messageDrafts[item.id];
    }
    inputWrap.appendChild(textarea);

    const sendBtn = el('button', {
      class: 'btn',
      style: 'margin-top: 6px; padding: 10px; font-size: 13px;',
      onclick: async () => {
        const text = textarea.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        sendBtn.textContent = '送出中...';

        const fresh = await loadState();
        const freshItem = findHistoryItemById(fresh, item.id);
        if (!freshItem) {
          alert('找不到這題的紀錄');
          sendBtn.disabled = false;
          sendBtn.textContent = '送出';
          return;
        }
        if (!freshItem.messages) freshItem.messages = [];
        freshItem.messages.push({
          by: myRole,
          text: text.slice(0, 300),
          at: new Date().toISOString()
        });
        state = fresh;
        delete messageDrafts[item.id];  // 送出後清掉草稿
        await saveState();
        render();
      }
    }, '送出');
    inputWrap.appendChild(sendBtn);

    container.appendChild(inputWrap);
  }

  // ============ 每週回顧 ============
  // 取得指定週次的開始/結束（週一為一週開始）
  function getWeekRange(weekOffset) {
    // weekOffset: 0=本週, -1=上週, etc
    const now = new Date();
    const day = now.getDay();  // 0=Sun, 1=Mon, ..., 6=Sat
    const daysFromMonday = day === 0 ? 6 : day - 1;
    const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysFromMonday);
    const start = new Date(thisMonday);
    start.setDate(start.getDate() + weekOffset * 7);
    const end = new Date(start);
    end.setDate(end.getDate() + 7);
    return { start, end };
  }

  function formatDate(d) {
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  let reviewWeekOffset = 0;  // 0 = 本週, -1 = 上週

  function renderReview() {
    const wrap = el('div');

    const { start, end } = getWeekRange(reviewWeekOffset);
    const endDisplay = new Date(end);
    endDisplay.setDate(endDisplay.getDate() - 1);  // 顯示週日（最後一天）

    // 篩選這週的歷史
    const weekItems = (state.history || []).filter(h => {
      const d = new Date(h.date);
      return d >= start && d < end;
    });

    // 切週按鈕
    const weekNav = el('div', { style: 'display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px;' });

    const prevBtn = el('button', {
      style: 'background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit;',
      onclick: () => { reviewWeekOffset--; render(); }
    }, '←');
    weekNav.appendChild(prevBtn);

    const label = reviewWeekOffset === 0 ? '本週' : reviewWeekOffset === -1 ? '上週' : `${-reviewWeekOffset} 週前`;
    weekNav.appendChild(el('div', {
      style: 'flex: 1; text-align: center; font-size: 13px; font-weight: 600;'
    }, label));

    const nextBtn = el('button', {
      style: `background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; ${reviewWeekOffset >= 0 ? 'opacity: 0.3; cursor: not-allowed;' : ''}`,
      onclick: () => { if (reviewWeekOffset < 0) { reviewWeekOffset++; render(); } }
    }, '→');
    weekNav.appendChild(nextBtn);
    wrap.appendChild(weekNav);

    // Banner 卡片
    const banner = el('div', {
      style: 'background: linear-gradient(135deg, var(--soft-a), #f7dde5); border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 14px;'
    });
    banner.appendChild(el('div', {
      style: 'font-size: 13px; color: var(--accent-a); font-weight: 600; letter-spacing: 1px;'
    }, reviewWeekOffset === 0 ? '本週回顧' : '回顧'));
    banner.appendChild(el('div', {
      style: 'font-size: 16px; font-weight: 700; margin-top: 4px; color: #5a3a2a;'
    }, `${formatDate(start)} – ${formatDate(endDisplay)}`));
    wrap.appendChild(banner);

    // 沒有資料
    if (weekItems.length === 0) {
      wrap.appendChild(el('div', { class: 'empty' }, '這週還沒有玩過題目'));
      return wrap;
    }

    // 統計
    let aGuessCount = 0, bGuessCount = 0, syncCount = 0;
    weekItems.forEach(h => {
      if (h.A.guess === h.B.answer) aGuessCount++;
      if (h.B.guess === h.A.answer) bGuessCount++;
      if (h.A.answer === h.B.answer) syncCount++;
    });
    const totalAttempts = weekItems.length * 2;  // 每題兩人各猜一次
    const guessHits = aGuessCount + bGuessCount;
    const hitRate = totalAttempts > 0 ? Math.round((guessHits / totalAttempts) * 100) : 0;

    const grid = el('div', { class: 'score-grid' });

    const b1 = el('div', { class: 'score-box' });
    b1.appendChild(el('div', { class: 'score-num', style: 'color: var(--accent-a);' }, `${weekItems.length}`));
    b1.appendChild(el('div', { class: 'score-label' }, '本週題目'));
    grid.appendChild(b1);

    const b2 = el('div', { class: 'score-box' });
    b2.appendChild(el('div', { class: 'score-num', style: 'color: var(--green);' }, `${hitRate}%`));
    b2.appendChild(el('div', { class: 'score-label' }, '本週命中率'));
    grid.appendChild(b2);
    wrap.appendChild(grid);

    // 同步分 + 個人猜中
    const detail = el('div', { class: 'card' });
    detail.appendChild(el('div', { class: 'label' }, '本週分數變化'));
    detail.appendChild(el('div', {
      style: 'font-size: 13px; line-height: 1.9;'
    }));
    detail.lastChild.innerHTML = `
      <div>${getAvatar('A')} <strong style="color:var(--accent-a)">${escapeHtml(state.names.A)}</strong>：默契 +${aGuessCount}　同步 +${syncCount}</div>
      <div>${getAvatar('B')} <strong style="color:var(--accent-b)">${escapeHtml(state.names.B)}</strong>：默契 +${bGuessCount}　同步 +${syncCount}</div>
    `;
    wrap.appendChild(detail);

    // 最有默契的題目（兩人都猜對 或 兩人選一樣）
    const matchTopics = weekItems.filter(h => {
      const aG = h.A.guess === h.B.answer;
      const bG = h.B.guess === h.A.answer;
      const sync = h.A.answer === h.B.answer;
      return (aG && bG) || sync;
    });
    if (matchTopics.length > 0) {
      const matchCard = el('div', { class: 'card' });
      matchCard.appendChild(el('div', { class: 'label' }, `本週最有默契（${matchTopics.length}）`));
      matchTopics.slice(0, 3).forEach(item => {
        const catInfo = CATEGORIES[item.question.cat] || CATEGORIES.daily;
        const row = el('div', { style: 'padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;' });
        row.innerHTML = `<span style="display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:${catInfo.bg};color:${catInfo.color};font-weight:600;margin-bottom:4px;">${catInfo.name}</span><div style="font-weight:600;margin-top:2px;">${escapeHtml(item.question.q)}</div>`;
        matchCard.appendChild(row);
      });
      if (matchCard.lastChild) matchCard.lastChild.style.borderBottom = 'none';
      wrap.appendChild(matchCard);
    }

    // 最意外的題目（兩人選不同 且 兩人都猜錯）
    const surpriseTopics = weekItems.filter(h => {
      const aG = h.A.guess === h.B.answer;
      const bG = h.B.guess === h.A.answer;
      const sync = h.A.answer === h.B.answer;
      return !sync && !aG && !bG;
    });
    if (surpriseTopics.length > 0) {
      const surpriseCard = el('div', { class: 'card' });
      surpriseCard.appendChild(el('div', { class: 'label' }, `本週最意外（${surpriseTopics.length}）`));
      surpriseTopics.slice(0, 3).forEach(item => {
        const catInfo = CATEGORIES[item.question.cat] || CATEGORIES.daily;
        const row = el('div', { style: 'padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;' });
        const aChose = item.A.answer === 'a' ? item.question.a : item.question.b;
        const bChose = item.B.answer === 'a' ? item.question.a : item.question.b;
        row.innerHTML = `<span style="display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:${catInfo.bg};color:${catInfo.color};font-weight:600;margin-bottom:4px;">${catInfo.name}</span><div style="font-weight:600;margin-top:2px;">${escapeHtml(item.question.q)}</div><div style="font-size:11px;color:var(--muted);margin-top:2px;">${getAvatar('A')} ${escapeHtml(aChose)}　${getAvatar('B')} ${escapeHtml(bChose)}</div>`;
        surpriseCard.appendChild(row);
      });
      if (surpriseCard.lastChild) surpriseCard.lastChild.style.borderBottom = 'none';
      wrap.appendChild(surpriseCard);
    }

    // 想討論的題目
    const wantDiscussTopics = weekItems.filter(h => {
      const wd = h.wantDiscuss || {};
      return wd.A || wd.B;
    });
    if (wantDiscussTopics.length > 0) {
      const wdCard = el('div', { class: 'card' });
      wdCard.appendChild(el('div', { class: 'label' }, `本週想討論（${wantDiscussTopics.length}）`));
      wantDiscussTopics.forEach(item => {
        const catInfo = CATEGORIES[item.question.cat] || CATEGORIES.daily;
        const row = el('div', { style: 'padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;' });
        row.innerHTML = `<span style="display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:${catInfo.bg};color:${catInfo.color};font-weight:600;margin-bottom:4px;">${catInfo.name}</span><div style="font-weight:600;margin-top:2px;">🔖 ${escapeHtml(item.question.q)}</div>`;
        wdCard.appendChild(row);
      });
      if (wdCard.lastChild) wdCard.lastChild.style.borderBottom = 'none';
      wrap.appendChild(wdCard);
    }

    return wrap;
  }

    tip.innerHTML = '加進來的題目會混進題庫，未來抽題會抽到。建議出兩個各有支持者、不要太極端的選項，這樣猜起來才有意思 😋';

    const card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'label' }, '新題目'));

    const aInput = el('input', { class: 'input', placeholder: 'A 選項，例如：日式' });
    const bInput = el('input', { class: 'input', placeholder: 'B 選項，例如：泰式' });

    card.appendChild(aInput);
    card.appendChild(bInput);

    card.appendChild(el('div', { class: 'label', style: 'margin-top: 4px;' }, '分類'));

      const btn = el('button', {
        style: `padding: 8px 4px; border-radius: 8px; border: 1.5px solid ${key === selectedCat ? info.color : 'var(--line)'}; background: ${key === selectedCat ? info.bg : 'var(--bg)'}; color: ${key === selectedCat ? info.color : 'var(--muted)'}; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;`,
        onclick: () => {
          selectedCat = key;
          catGrid.querySelectorAll('button').forEach((b, i) => {
            const k = Object.keys(CATEGORIES)[i];
            const ci = CATEGORIES[k];
            const isSel = k === selectedCat;
            b.style.borderColor = isSel ? ci.color : 'var(--line)';
            b.style.background = isSel ? ci.bg : 'var(--bg)';
            b.style.color = isSel ? ci.color : 'var(--muted)';
          });
        }
      }, info.name);
      catGrid.appendChild(btn);
    });
    card.appendChild(catGrid);

    const submitBtn = el('button', {
      class: 'btn',
      onclick: async () => {
        const q = qInput.value.trim();
        const a = aInput.value.trim();
        const b = bInput.value.trim();
        if (!q || !a || !b) {
          alert('三個欄位都要填喔');
          return;
        }
        const fresh = await loadState();
        state = fresh;
        if (!state.customQuestions) state.customQuestions = [];
        state.customQuestions.push({ q, a, b, cat: selectedCat, addedBy: myRole });
        await saveState();
        qInput.value = '';
        aInput.value = '';
        bInput.value = '';
        alert('加好了！');
        render();
      }
    }, '加入題庫');

    wrap.appendChild(card);

    // 列出自訂題目
    if (state.customQuestions.length > 0) {
      const listCard = el('div', { class: 'card' });
      listCard.appendChild(el('div', { class: 'label' }, `你們加的題目（${state.customQuestions.length}）`));
      state.customQuestions.forEach((q, idx) => {
        const item = el('div', {
          style: 'padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: start; gap: 10px;'
        });

        const catInfo = CATEGORIES[q.cat] || CATEGORIES.daily;
        const text = el('div', { style: 'flex: 1; font-size: 13px;' });
        text.innerHTML = `<span style="display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: ${catInfo.bg}; color: ${catInfo.color}; font-weight: 600; margin-bottom: 4px;">${catInfo.name}</span><div style="font-weight: 600; margin-bottom: 3px;">${escapeHtml(q.q)}</div><div style="color: var(--muted);">${escapeHtml(q.a)} / ${escapeHtml(q.b)}</div>`;
        item.appendChild(text);

        const del = el('button', {
          class: 'btn btn-ghost btn-small',
          onclick: async () => {
            if (await customConfirm('刪掉這題？', { danger: true, okText: '刪除' })) {
              // 用題目內容比對找到對應的，不用 index（對方可能剛加題、index 會錯位）
              const fresh = await loadState();
              state = fresh;
              if (!state.customQuestions) state.customQuestions = [];
              const realIdx = state.customQuestions.findIndex(cq =>
                cq.q === q.q && cq.a === q.a && cq.b === q.b
              );
              if (realIdx >= 0) {
                state.customQuestions.splice(realIdx, 1);
                await saveState();
              }
              render();
            }
          }
        }, '刪');
        item.appendChild(del);

        listCard.appendChild(item);
      });
      wrap.appendChild(listCard);
    }

    return wrap;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ============ 啟動 ============
  async function init() {
    roomCode = loadRoom();
    myRole = loadRole();

    if (!roomCode) {
      // 還沒選房間 → 顯示房間登入畫面
      state = defaultState();
      render();
      return;
    }

    // 已有房間 → 訂閱 Firestore 即時更新
    await connectRoom(roomCode);
  }

  async function connectRoom(code) {
    roomCode = code;
    saveRoom(code);

    // 先初始載入一次
    state = await loadState();

    // 如果房間是空的（新建），寫入初始狀態
    const snap = await getDoc(doc(db, 'rooms', code));
    if (!snap.exists()) {
      await saveState();
    }

    // 自動恢復身分：如果本機 localStorage 記錄了這個房間的舊身分，
    // 而雲端也還掛著這個身分（claimedRoles[role] = true），就自動沿用
    const savedRole = loadRole();
    if (savedRole && state.claimedRoles && state.claimedRoles[savedRole]) {
      myRole = savedRole;
    } else if (savedRole && (!state.claimedRoles || !state.claimedRoles[savedRole])) {
      // 雲端沒有這個 claim（可能是房間被重置），但本機還記得 → 自動補回
      // 再撈一次最新確保不覆蓋對方
      const fresh = await loadState();
      state = fresh;
      if (!state.claimedRoles) state.claimedRoles = { A: false, B: false };
      state.claimedRoles[savedRole] = true;
      myRole = savedRole;
      await saveState();
    }

    // 即時訂閱：對方一寫資料就馬上同步到本機
    if (unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(doc(db, 'rooms', code), (docSnap) => {
      if (!docSnap.exists()) return;
      const fresh = docSnap.data();

      // 防呆：如果本機已經把自己的答案寫進 currentRound、但雲端版本卻沒有
      // （表示對方剛寫了一筆但雲端是他寫之前的快照、沒包含我），這種情況極罕見，
      // 但我們不應該讓本機的答案被「不完整的雲端版本」蓋掉。
      // 解法：如果本機 currentRound[myRole] 有值、雲端的同回合沒有，就保留本機的答案。
      if (state.currentRound && fresh.currentRound &&
          state.currentRound.questionIdx === fresh.currentRound.questionIdx) {
        if (state.currentRound[myRole] && !fresh.currentRound[myRole]) {
          fresh.currentRound[myRole] = state.currentRound[myRole];
        }
      }

      // 自動揭曉：本機沒有揭曉、雲端有兩人答案也沒揭曉 → 由本機觸發揭曉計分
      if (state.currentRound && fresh.currentRound &&
          fresh.currentRound.A && fresh.currentRound.B &&
          !fresh.currentRound.revealed && !state.currentRound.revealed) {
        state = fresh;
        doReveal();
        saveState();  // 寫回 revealed 狀態，對方會立刻收到
        render();
      } else {
        state = fresh;
        render();
      }
    });

    render();
  }

  init();
</script>
</body>
</html>
